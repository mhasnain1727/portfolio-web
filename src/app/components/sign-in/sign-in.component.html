<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="signin-container card shadow p-4">
        <h2 class="text-primary mb-4 text-center">Sign In</h2>
        <form [formGroup]="signinForm">
            <div class="mb-3">
                <mat-form-field appearance="fill" class="w-100" floatLabel="always">
                    <mat-label>Email</mat-label>
                    <input matInput placeholder="" formControlName="email" (blur)="updateErrorMessage()"
                        required />
                    <mat-error *ngIf="signinForm.get('email')?.invalid">{{ errorMessage() }}</mat-error>
                    <mat-error *ngIf="signinForm.get('email')?.touched && signinForm.get('email')?.invalid">Valid
                        Email
                        is required</mat-error>
                </mat-form-field>
            </div>

            <div class="mb-3">
                <mat-form-field appearance="fill" class="w-100" floatLabel="always">
                    <mat-label>Password</mat-label>
                    <input matInput type="password" formControlName="password" />
                    <mat-error *ngIf="signinForm.get('password')?.touched && signinForm.get('password')?.invalid">
                        Password is required
                    </mat-error>
                </mat-form-field>
            </div>

            <button mat-raised-button color="primary" class="w-100 mt-2" type="submit" (click)="onSubmit()">
                Login
            </button>

            <div class="d-flex justify-content-between align-items-center mt-4">
                <button mat-stroked-button color="warn" (click)="goBack()">Back</button>

                <div class="mx-2">
                    <span>Don't have an account?</span>
                    <a class="text-decoration-underline text-primary" (click)="navigateToSignup()"
                        style="cursor: pointer;">Register</a>
                </div>
            </div>
        </form>
    </div>
</div>
