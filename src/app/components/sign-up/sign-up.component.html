<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="signup-container">
        <h1 class="text-primary mb-4 text-center">Sign Up</h1>
        <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <mat-form-field appearance="fill" class="w-100">
                        <mat-label>Full Name</mat-label>
                        <input matInput formControlName="fullName" />
                        <mat-error
                            *ngIf="signupForm.get('fullName')?.touched && signupForm.get('fullName')?.invalid">Full
                            Name is required</mat-error>
                    </mat-form-field>
                </div>

                <div class="col-md-6 mb-3">
                    <mat-form-field appearance="fill" class="w-100">
                        <mat-label>Email</mat-label>
                        <input matInput placeholder="abc@example.com" formControlName="email"
                            (blur)="updateErrorMessage()" required />
                        <mat-error *ngIf="signupForm.get('email')?.invalid">{{ errorMessage() }}</mat-error>
                        <mat-error *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid">Valid
                            Email
                            is required</mat-error>
                    </mat-form-field>
                </div>

                <div class="col-md-6 mb-3">
                    <mat-form-field appearance="fill" class="w-100">
                        <mat-label>Phone Number</mat-label>
                        <input matInput formControlName="phone" maxlength="10" />
                        <mat-error *ngIf="signupForm.get('phone')?.touched && signupForm.get('phone')?.invalid">Enter
                            10-digit Phone Number</mat-error>
                    </mat-form-field>
                </div>

                <div class="col-md-6 mb-3">
                    <mat-form-field appearance="fill" class="w-100">
                        <mat-label>User Type</mat-label>
                        <mat-select formControlName="userType">
                            <mat-option value="student">Student</mat-option>
                            <mat-option value="teacher">Teacher</mat-option>
                            <!-- <mat-hint align="end">Here's the dropdown arrow ^</mat-hint> -->
                        </mat-select>
                    </mat-form-field>
                </div>

                <div class="col-md-6 mb-3">
                    <mat-form-field appearance="fill" class="w-100">
                        <mat-label>Password</mat-label>
                        <input matInput [type]="hide ? 'password' : 'text'" formControlName="password">
                        <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'"
                            [attr.aria-pressed]="hide">
                            <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                        </button>
                        <mat-error *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.invalid">
                            Password must be at least 6 characters
                        </mat-error>
                    </mat-form-field>
                </div>

                <div class="col-md-6 mb-3">
                    <mat-form-field appearance="fill" class="w-100">
                        <mat-label>Confirm Password</mat-label>
                        <input matInput type="password" formControlName="confirmPassword" />
                        <mat-error
                            *ngIf="signupForm.get('confirmPassword')?.touched && signupForm.get('confirmPassword')?.invalid">
                                Confirm Password is required.
                            <!-- <small *ngIf="signupForm.get('confirmPassword').errors?.['required']">Confirm Password is
                                required.</small>
                            <small *ngIf="signupForm.get('confirmPassword').errors?.['notMatching']">Passwords do not
                                match.</small> -->
                        </mat-error>
                    </mat-form-field>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Profile Image (Optional)</label>
                    <input type="file" class="form-control" (change)="onImageChange($event)" accept="image/*" />
                    <img *ngIf="imagePreview" [src]="imagePreview" class="img-thumbnail mt-2"
                        style="width: 120px; height: 120px; object-fit: cover;" />
                </div>
            </div>

            <button mat-raised-button color="primary" class="mt-3 w-100" type="submit">Register</button>
        </form>
    </div>
</div>
