<mat-sidenav-container class="sidenav-container" [hasBackdrop]="false">
  <mat-sidenav
    #drawer
    mode="side"
    [opened]="!collapsed"
    class="sidebar"
    [fixedInViewport]="true"
  >
    <div class="sidebar-header p-3 text-white">
      <p>{{ userData?.userType | uppercase}}</p>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a mat-list-item routerLink="/profile" routerLinkActive="active">Profile</a>
    </mat-nav-list>
  </mat-sidenav>
</mat-sidenav-container>
